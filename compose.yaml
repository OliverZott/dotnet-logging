services:
  dotnet-logging-sample1:
    image: dotnet-logging-sample1
    build:
      context: .
      dockerfile: dotnet-logging-sample1/Dockerfile
    ports:
      - "5080:8080"   # API -> http://localhost:5080/WeatherForecast (host 8080 is taken by Apache)
    environment:
      # Inside the compose network, use service names + container ports.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://seq:5341/ingest/otlp
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - ASPIRE_OTLP_ENDPOINT=http://aspire-dashboard:18889
    depends_on:
      - seq
      - aspire-dashboard

  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "15341:5341"  # ingestion (HTTP + OTLP) + API -> http://localhost:15341
      - "8082:80"      # web UI -> http://localhost:8082
    volumes:
      - seq-data:/data

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: aspire-dashboard
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    ports:
      - "18888:18888"  # web UI -> http://localhost:18888
      - "4317:18889"   # OTLP gRPC ingestion -> use as OTEL_EXPORTER_OTLP_ENDPOINT

volumes:
  seq-data:

